<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">碳迹绿行项目脉络</title><desc id="desc">从日常低碳选择开始，经轻量记录与相对评分形成可见反馈，再通过微信小程序和独立 Web 实现，最终作为历史项目开源。</desc><rect width="1200" height="520" rx="24" fill="#f2f7f3"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif"><text x="54" y="64" font-size="14" letter-spacing="3" fill="#587261">CARBON TRACKER · PROJECT STORY</text><text x="54" y="116" font-size="34" font-weight="700" fill="#19392b">把一次低碳选择，变成可见的成长</text><text x="54" y="153" font-size="18" fill="#587261">产品动机 → 行为机制 → 双端实现 → 历史开源</text><g fill="#fff" stroke="#cfdfd2"><rect x="54" y="197" width="250" height="128" rx="14"/><rect x="332" y="197" width="250" height="128" rx="14"/><rect x="610" y="197" width="250" height="128" rx="14"/><rect x="888" y="197" width="258" height="128" rx="14"/></g><g fill="#214d37" font-size="23" font-weight="650"><text x="77" y="246">01 轻量记录</text><text x="355" y="246">02 相对评分</text><text x="633" y="246">03 可见反馈</text><text x="911" y="246">04 持续回看</text></g><g fill="#587261" font-size="16"><text x="77" y="285">出行 · 饮食 · 生活状态</text><text x="355" y="285">有限选项 → 行为比较</text><text x="633" y="285">积分 · 树木 · 等级</text><text x="911" y="285">趋势 · 历史 · 成就</text></g><g fill="#4c855b" font-size="24"><text x="312" y="268">›</text><text x="590" y="268">›</text><text x="868" y="268">›</text></g><rect x="54" y="359" width="1092" height="107" rx="14" fill="#19392b"/><text x="78" y="403" font-size="21" font-weight="600" fill="#fff">微信小程序 v6.7</text><text x="438" y="403" font-size="21" font-weight="600" fill="#fff">Web v5.0</text><text x="780" y="403" font-size="21" font-weight="600" fill="#bce1bf">停服后 · 开源展示</text><text x="78" y="437" font-size="15" fill="#bce1bf">微信身份 / 云函数 / 云数据库</text><text x="438" y="437" font-size="15" fill="#bce1bf">React / FastAPI / SQLite</text><text x="780" y="437" font-size="15" fill="#bce1bf">保留源码与脉络 · 不再维护</text></g></svg>